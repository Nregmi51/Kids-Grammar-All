    { id:81, q:"What is the Past Participle (V3) of 'Ride' (सवारी चढ्नु / चलाउनु)?", opts:["ride","rode","ridden","ring"], correct:"C" },
    { id:82, q:"What is the present form (V1) of 'rung' (बज्नु / घण्टी बजाउनु)?", opts:["rang","rung","ring","rise"], correct:"C" },
    { id:83, q:"What is the past form (V2) of 'Rise' (उठ्नु / बढ्नु)?", opts:["rose","rise","risen","run"], correct:"A" },
    { id:84, q:"What is the Past Participle (V3) of 'Run' (दौडनु)?", opts:["ran","run","ring","rise"], correct:"B" },
    { id:85, q:"What is the present form (V1) of 'said' (भन्नु)?", opts:["said","see","say","seek"], correct:"C" },
    { id:86, q:"What is the past form (V2) of 'See' (हेर्नु / देख्नु)?", opts:["see","seen","seek","saw"], correct:"D" },
    { id:87, q:"What is the Past Participle (V3) of 'Seek' (खोज्नु)?", opts:["sought","seek","saw","seen"], correct:"A" },
    { id:88, q:"What is the present form (V1) of 'sold' (बेच्नु)?", opts:["sell","sold","send","set"], correct:"A" },
    { id:89, q:"What is the past form (V2) of 'Send' (पठाउनु)?", opts:["send","sent","sold","set"], correct:"B" },
    { id:90, q:"What is the Past Participle (V3) of 'Set' (सेट गर्नु / राख्नु)?", opts:["setted","sewed","set","shown"], correct:"C" },
    { id:91, q:"What is the present form (V1) of 'sewn' (सिउनु)?", opts:["sewed","sewn","sew","shake"], correct:"C" },
    { id:92, q:"What is the past form (V2) of 'Shake' (हल्लाउनु / चलाउनु)?", opts:["shook","shake","shaken","shone"], correct:"A" },
    { id:93, q:"What is the Past Participle (V3) of 'Shine' (चम्किनु / चम्काउनु)?", opts:["shine","shone","shined","shook"], correct:"B" },
    { id:94, q:"What is the present form (V1) of 'shot' (गोली हान्नु / प्रहार गर्नु)?", opts:["shot","shone","shoot","show"], correct:"C" },
    { id:95, q:"What is the past form (V2) of 'Show' (देखाउनु)?", opts:["show","shown","shook","showed"], correct:"D" },
    { id:96, q:"What is the Past Participle (V3) of 'Shrink' (खुम्चिनु / साँघुरिनु)?", opts:["shrunk","shrink","shrank","shut"], correct:"A" },
    { id:97, q:"What is the present form (V1) of 'shut' (बन्द गर्नु)?", opts:["shut","shutted","sing","sink"], correct:"A" },
    { id:98, q:"What is the past form (V2) of 'Sing' (गाउनु)?", opts:["sing","sang","sung","sink"], correct:"B" },
    { id:99, q:"What is the Past Participle (V3) of 'Sink' (डुब्नु)?", opts:["sink","sank","sunk","sit"], correct:"C" },
    { id:100, q:"What is the present form (V1) of 'sat' (बस्नु)?", opts:["sat","sang","sit","sunk"], correct:"C" }
  ];

  // --------------------------------------------------------------
  // QUIZ ENGINE
  // --------------------------------------------------------------
  let currentQuestions = [];
  let currentIndex = 0;
  let score = 0;
  let timerId = null;
  let isAnswering = false;

  const controlsEl = document.getElementById('controls');
  const startBtn = document.getElementById('startBtn');
  const quizArea = document.getElementById('quizArea');
  const scoreArea = document.getElementById('scoreArea');
  const progressEl = document.getElementById('progress');
  const qText = document.getElementById('qText');
  const optionsContainer = document.getElementById('optionsContainer');
  const scoreNum = document.getElementById('scoreNum');
  const totalQSpan = document.getElementById('totalQ');
  const feedbackMsg = document.getElementById('feedbackMsg');
  const resetBtn = document.getElementById('resetBtn');
  const qCountSelect = document.getElementById('qCountSelect');
  const rangeFrom = document.getElementById('rangeFrom');
  const rangeTo = document.getElementById('rangeTo');

  function getSelectedRange() {
    let from = parseInt(rangeFrom.value, 10);
    let to = parseInt(rangeTo.value, 10);
    if (isNaN(from) || from < 1) from = 1;
    if (isNaN(to) || to > 100) to = 100;
    if (from > to) { let tmp = from; from = to; to = tmp; }
    return { from, to };
  }

  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function startQuiz() {
    // Clear any previous timer
    if (timerId) { clearTimeout(timerId); timerId = null; }
    // Reset UI
    score = 0;
    currentIndex = 0;
    isAnswering = false;
    quizArea.classList.remove('active');
    scoreArea.classList.remove('active');

    // Get range
    const { from, to } = getSelectedRange();
    // Filter questions within range (IDs are 1-100)
    const filtered = questionsData.filter(q => q.id >= from && q.id <= to);
    if (filtered.length === 0) {
      alert('No questions in that range. Please adjust.');
      return;
    }

    // Determine count
    let count = qCountSelect.value;
    let numQuestions;
    if (count === 'all') {
      numQuestions = filtered.length;
    } else {
      numQuestions = parseInt(count, 10);
      if (isNaN(numQuestions) || numQuestions < 1) numQuestions = 5;
      if (numQuestions > filtered.length) numQuestions = filtered.length;
    }

    // Shuffle filtered and pick first numQuestions
    const shuffled = shuffleArray([...filtered]);
    currentQuestions = shuffled.slice(0, numQuestions);

    // Hide controls, show quiz
    controlsEl.style.display = 'none';
    quizArea.classList.add('active');
    scoreArea.classList.remove('active');

    // Show first question
    showQuestion();
  }

  function showQuestion() {
    if (currentIndex >= currentQuestions.length) {
      endQuiz();
      return;
    }
    const q = currentQuestions[currentIndex];
    qText.textContent = q.q;
    // Build options
    const letters = ['A', 'B', 'C', 'D'];
    optionsContainer.innerHTML = '';
    q.opts.forEach((opt, idx) => {
      const div = document.createElement('div');
      div.className = 'option';
      div.dataset.letter = letters[idx];
      div.innerHTML = `<span class="letter">${letters[idx]}</span> ${opt}`;
      div.addEventListener('click', () => handleOptionClick(div, letters[idx], q.correct));
      optionsContainer.appendChild(div);
    });

    // Update progress
    progressEl.textContent = `Question ${currentIndex + 1} / ${currentQuestions.length}`;
    isAnswering = false; // allow clicks
  }

  function handleOptionClick(el, selectedLetter, correctLetter) {
    if (isAnswering) return;
    isAnswering = true;

    // Disable all options
    const allOptions = document.querySelectorAll('.option');
    allOptions.forEach(opt => opt.classList.add('disabled'));

    // Highlight correct and wrong
    let isCorrect = (selectedLetter === correctLetter);
    if (isCorrect) {
      score++;
      el.classList.add('correct');
    } else {
      el.classList.add('wrong');
      // Also show correct answer
      allOptions.forEach(opt => {
        if (opt.dataset.letter === correctLetter) {
          opt.classList.add('show-correct');
        }
      });
    }

    // Auto advance after 1.5 sec
    if (timerId) clearTimeout(timerId);
    timerId = setTimeout(() => {
      timerId = null;
      currentIndex++;
      showQuestion();
    }, 1500);
  }

  function endQuiz() {
    quizArea.classList.remove('active');
    scoreArea.classList.add('active');
    const total = currentQuestions.length;
    scoreNum.textContent = score;
    totalQSpan.textContent = total;
    const pct = Math.round((score / total) * 100);
    let msg = '';
    if (pct === 100) msg = '🌟 Perfect! Outstanding!';
    else if (pct >= 80) msg = '🎉 Excellent! Great job!';
    else if (pct >= 60) msg = '💪 Good effort! Keep learning!';
    else if (pct >= 40) msg = '📖 Practice more! You\'ll improve.';
    else msg = '😅 Don\'t give up! Review the verbs.';
    feedbackMsg.textContent = msg;
    controlsEl.style.display = 'block'; // show controls again
  }

  // Reset / Try again
  function resetQuiz() {
    if (timerId) { clearTimeout(timerId); timerId = null; }
    controlsEl.style.display = 'block';
    quizArea.classList.remove('active');
    scoreArea.classList.remove('active');
    // Enable start button (it's already enabled)
  }

  // Event listeners
  startBtn.addEventListener('click', startQuiz);
  resetBtn.addEventListener('click', resetQuiz);

  // Ensure range inputs are within bounds
  rangeFrom.addEventListener('change', function() {
    let v = parseInt(this.value, 10);
    if (isNaN(v) || v < 1) this.value = 1;
    if (v > 100) this.value = 100;
  });
  rangeTo.addEventListener('change', function() {
    let v = parseInt(this.value, 10);
    if (isNaN(v) || v < 1) this.value = 1;
    if (v > 100) this.value = 100;
  });

  // Initially hide quiz area, show controls
  controlsEl.style.display = 'block';
  quizArea.classList.remove('active');
  scoreArea.classList.remove('active');
</script>
