<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mastering Articles: A, An, The</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #00b894;
            --danger: #d63031;
            --dark: #2d3436;
            --light: #f9f9f9;
            --accent: #fdcb6e;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(45deg, #6c5ce7, #a29bfe);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--dark);
        }

        #quiz-container {
            background: white;
            width: 95%;
            max-width: 650px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
            position: relative;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        #timer-box {
            background: var(--danger);
            color: white;
            padding: 8px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1.2rem;
            min-width: 60px;
        }

        #score-box {
            background: var(--primary);
            color: white;
            padding: 8px 20px;
            border-radius: 12px;
            font-weight: bold;
        }

        .group-tag {
            background: var(--accent);
            color: #7f4f00;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        #question-text {
            font-size: 1.5rem;
            margin: 25px 0;
            line-height: 1.4;
            font-weight: 600;
        }

        .options-container {
            display: grid;
            gap: 15px;
        }

        .option-btn {
            background: var(--light);
            border: 2px solid #dfe6e9;
            padding: 16px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .option-btn:hover:not([disabled]) {
            transform: translateY(-2px);
            border-color: var(--primary);
            background: #f0edff;
        }

        .correct { background: #55efc4 !important; border-color: #00b894 !important; color: #004d3e; }
        .wrong { background: #ff7675 !important; border-color: #d63031 !important; color: #4d0000; }

        #feedback {
            margin-top: 20px;
            height: 24px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        #next-btn {
            margin-top: 25px;
            background: var(--dark);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            display: none;
            transition: opacity 0.3s;
        }

        .progress-container {
            width: 100%;
            height: 10px;
            background: #eee;
            border-radius: 5px;
            margin-top: 30px;
            overflow: hidden;
        }

        #progress-fill {
            height: 100%;
            background: var(--secondary);
            width: 0%;
            transition: width 0.4s ease;
        }
    </style>
</head>
<body>

<div id="quiz-container">
    <div class="stats-bar">
        <div id="score-box">Score: 0</div>
        <div id="group-name" class="group-tag">Loading...</div>
        <div id="timer-box">30</div>
    </div>
    
    <div id="question-text">Question loading...</div>
    
    <div class="options-container" id="options-box"></div>

    <div id="feedback"></div>
    <button id="next-btn" onclick="nextQuestion()">Next Question &rarr;</button>

    <div class="progress-container">
        <div id="progress-fill"></div>
    </div>
</div>

<script>
    const questions = [
        // GROUP 1: Indefinite Articles (A / An)
        { q: "She ate ___ apple after lunch.", options: ["a", "an", "the"], a: 1, g: "Group 1: A vs An" },
        { q: "I need to buy ___ new umbrella.", options: ["a", "an", "the"], a: 1, g: "Group 1: A vs An" },
        { q: "He is studying at ___ university in Europe.", options: ["a", "an", "the"], a: 0, g: "Group 1: A vs An" },
        { q: "It will take ___ hour to get there.", options: ["a", "an", "the"], a: 1, g: "Group 1: A vs An" },
        { q: "My father is ___ honest man.", options: ["a", "an", "the"], a: 1, g: "Group 1: A vs An" },
        { q: "There is ___ cat on the roof.", options: ["a", "an", "the"], a: 0, g: "Group 1: A vs An" },
        { q: "She wants to be ___ doctor.", options: ["a", "an", "the"], a: 0, g: "Group 1: A vs An" },
        { q: "I saw ___ elephant at the zoo.", options: ["a", "an", "the"], a: 1, g: "Group 1: A vs An" },
        { q: "This is ___ once-in-a-lifetime chance.", options: ["a", "an", "the"], a: 0, g: "Group 1: A vs An" },
        { q: "He works for ___ union.", options: ["a", "an", "the"], a: 0, g: "Group 1: A vs An" },

        // GROUP 2: Definite Articles (The)
        { q: "___ Sun is very bright today.", options: ["A", "An", "The"], a: 2, g: "Group 2: Using 'The'" },
        { q: "Paris is ___ capital of France.", options: ["a", "an", "the"], a: 2, g: "Group 2: Using 'The'" },
        { q: "Who is ___ tallest person in your class?", options: ["a", "an", "the"], a: 2, g: "Group 2: Using 'The'" },
        { q: "We went to ___ Pacific Ocean last summer.", options: ["a", "an", "the"], a: 2, g: "Group 2: Using 'The'" },
        { q: "Look at ___ moon tonight!", options: ["a", "an", "the"], a: 2, g: "Group 2: Using 'The'" },
        { q: "He plays ___ guitar very well.", options: ["a", "an", "the"], a: 2, g: "Group 2: Using 'The'" },
        { q: "___ Earth revolves around the sun.", options: ["A", "An", "The"], a: 2, g: "Group 2: Using 'The'" },
        { q: "I have to see ___ President about this.", options: ["a", "an", "the"], a: 2, g: "Group 2: Using 'The'" },
        { q: "___ Himalayas are beautiful.", options: ["A", "An", "The"], a: 2, g: "Group 2: Using 'The'" },
        { q: "Can you pass ___ salt, please?", options: ["a", "an", "the"], a: 2, g: "Group 2: Using 'The'" },

        // GROUP 3: Contextual Choice (Mixed)
        { q: "I saw ___ movie yesterday. ___ movie was boring.", options: ["A / The", "An / The", "The / A"], a: 0, g: "Group 3: Contextual" },
        { q: "Give me ___ pen that is on the table.", options: ["a", "an", "the"], a: 2, g: "Group 3: Contextual" },
        { q: "She is ___ best student in the school.", options: ["a", "an", "the"], a: 2, g: "Group 3: Contextual" },
        { q: "I bought ___ orange and a pear.", options: ["a", "an", "the"], a: 1, g: "Group 3: Contextual" },
        { q: "Is there ___ airport near here?", options: ["a", "an", "the"], a: 1, g: "Group 3: Contextual" },
        { q: "I'm going to ___ bank to get some cash.", options: ["a", "an", "the"], a: 2, g: "Group 3: Contextual" },
        { q: "He lives in ___ small apartment.", options: ["a", "an", "the"], a: 0, g: "Group 3: Contextual" },
        { q: "___ birds are singing in the garden.", options: ["A", "An", "The"], a: 2, g: "Group 3: Contextual" },
        { q: "Do you have ___ umbrella I can borrow?", options: ["a", "an", "the"], a: 1, g: "Group 3: Contextual" },
        { q: "___ Nile is the longest river.", options: ["A", "An", "The"], a: 2, g: "Group 3: Contextual" },

        // GROUP 4: Common Phrases & Advanced
        { q: "Would you like ___ cup of tea?", options: ["a", "an", "the"], a: 0, g: "Group 4: Advanced Phrases" },
        { q: "He had ___ accident this morning.", options: ["a", "an", "the"], a: 1, g: "Group 4: Advanced Phrases" },
        { q: "This is ___ interesting story.", options: ["a", "an", "the"], a: 1, g: "Group 4: Advanced Phrases" },
        { q: "She is ___ European citizen.", options: ["a", "an", "the"], a: 0, g: "Group 4: Advanced Phrases" },
        { q: "I met ___ one-eyed man in the market.", options: ["a", "an", "the"], a: 0, g: "Group 4: Advanced Phrases" },
        { q: "___ United Kingdom consists of four countries.", options: ["A", "An", "The"], a: 2, g: "Group 4: Advanced Phrases" },
        { q: "I listen to ___ radio every morning.", options: ["a", "an", "the"], a: 2, g: "Group 4: Advanced Phrases" },
        { q: "It's ___ beautiful day, isn't it?", options: ["a", "an", "the"], a: 0, g: "Group 4: Advanced Phrases" },
        { q: "He is ___ only child in the family.", options: ["a", "an", "the"], a: 2, g: "Group 4: Advanced Phrases" },
        { q: "___ sky is getting dark.", options: ["A", "An", "The"], a: 2, g: "Group 4: Advanced Phrases" }
    ];

    let currentIndex = 0;
    let score = 0;
    let timeLeft = 30;
    let timerId;

    const qText = document.getElementById('question-text');
    const optBox = document.getElementById('options-box');
    const timerBox = document.getElementById('timer-box');
    const scoreBox = document.getElementById('score-box');
    const groupName = document.getElementById('group-name');
    const feedback = document.getElementById('feedback');
    const nextBtn = document.getElementById('next-btn');
    const progressFill = document.getElementById('progress-fill');

    function startTimer() {
        timeLeft = 30;
        timerBox.textContent = timeLeft;
        timerId = setInterval(() => {
            timeLeft--;
            timerBox.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerId);
                handleSelect(-1); // Timeout
            }
        }, 1000);
    }

    function loadQuestion() {
        const q = questions[currentIndex];
        qText.textContent = q.q;
        groupName.textContent = q.g;
        optBox.innerHTML = '';
        feedback.textContent = '';
        nextBtn.style.display = 'none';

        q.options.forEach((opt, i) => {
            const b = document.createElement('button');
            b.className = 'option-btn';
            b.textContent = opt;
            b.onclick = () => handleSelect(i);
            optBox.appendChild(b);
        });
        startTimer();
    }

    function handleSelect(idx) {
        clearInterval(timerId);
        const q = questions[currentIndex];
        const btns = optBox.getElementsByClassName('option-btn');
        
        for (let b of btns) b.disabled = true;

        if (idx === q.a) {
            score++;
            scoreBox.textContent = `Score: ${score}`;
            btns[idx].classList.add('correct');
            feedback.textContent = "Great! That's correct.";
            feedback.style.color = "#00b894";
        } else {
            if (idx !== -1) btns[idx].classList.add('wrong');
            btns[q.a].classList.add('correct');
            feedback.textContent = idx === -1 ? "Out of time!" : "Not quite right.";
            feedback.style.color = "#d63031";
        }
        nextBtn.style.display = 'inline-block';
        progressFill.style.width = ((currentIndex + 1) / questions.length * 100) + '%';
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < questions.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        qText.textContent = "Quiz Complete!";
        groupName.textContent = "Final Result";
        optBox.innerHTML = `<h3>You scored ${score} out of 40</h3><p>${(score/40*100).toFixed(0)}% Mastery</p>`;
        timerBox.style.display = 'none';
        nextBtn.textContent = "Try Again";
        nextBtn.onclick = () => location.reload();
        nextBtn.style.display = 'inline-block';
    }

    loadQuestion();
</script>
</body>
</html>
