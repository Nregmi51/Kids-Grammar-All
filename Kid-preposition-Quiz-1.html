<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preposition Quiz</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #36d1dc, #5b86e5);
    margin: 0;
    padding: 10px;
}

.container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 15px;
    border-radius: 12px;
}

h1 {
    text-align: center;
    font-size: 22px;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 10px;
}

.question {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 15px;
}

.options label {
    display: block;
    padding: 12px;
    margin: 8px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 16px;
    cursor: pointer;
}

.buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 15px;
}

button {
    flex: 1;
    margin: 5px;
    padding: 12px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    color: white;
}

.prev { background: #007bff; }
.next { background: #28a745; }
.reset {
    background: #dc3545;
    width: 100%;
    margin-top: 10px;
}

.feedback {
    margin-top: 10px;
    font-weight: bold;
    text-align: center;
    font-size: 16px;
}
</style>

</head>

<body>

<div class="container">

<h1>Preposition Quiz</h1>

<div class="top-bar">
<span id="count">Q1/20</span>
<span id="score">Score: 0</span>
</div>

<div id="quiz"></div>

<div id="feedback" class="feedback"></div>

<div class="buttons">
<button class="prev" onclick="prevQ()">Previous</button>
<button class="next" onclick="nextQ()">Next</button>
</div>

<button class="reset" onclick="resetQuiz()">Reset Quiz</button>

</div>

<script>

const questions = [
["The book is ___ the table.", ["under","in","on","with"], "on"],
["She is ___ the room.", ["on","at","in","over"], "in"],
["We meet ___ 6 pm.", ["on","with","at","in"], "at"],
["The dog is ___ the table.", ["in","under","on","for"], "under"],
["He walked ___ the river.", ["over","along","in","with"], "along"],
["This gift is ___ you.", ["with","for","on","at"], "for"],
["The bird flew ___ the tree.", ["under","on","over","in"], "over"],
["The train went ___ the tunnel.", ["over","in","through","at"], "through"],
["She is talking ___ her friend.", ["on","with","in","at"], "with"],
["The keys are ___ my bag.", ["on","with","in","under"], "in"],
["The picture is ___ the wall.", ["in","on","at","over"], "on"],
["He is waiting ___ the bus stop.", ["for","in","on","at"], "at"],
["The cat is ___ the chair.", ["on","with","under","in"], "under"],
["They walked ___ the road.", ["in","along","on","at"], "along"],
["She bought a gift ___ her brother.", ["on","at","for","with"], "for"],
["The plane flew ___ the clouds.", ["under","over","in","on"], "over"],
["The mouse ran ___ the hole.", ["in","on","through","with"], "through"],
["He is playing ___ his friend.", ["on","at","with","in"], "with"],
["The ball is ___ the box.", ["under","in","on","with"], "in"],
["The lamp is ___ the table.", ["in","under","at","on"], "on"]
];

let current = 0;
let score = 0;
let answers = new Array(questions.length).fill(null);

function loadQuestion() {
    const q = questions[current];

    document.getElementById("count").innerText = `Q${current+1}/20`;
    document.getElementById("score").innerText = `Score: ${score}`;

    let html = `<div class="question">${q[0]}</div><div class="options">`;

    q[1].forEach(opt => {
        let checked = answers[current] === opt ? "checked" : "";
        html += `<label>
        <input type="radio" name="option" value="${opt}" ${checked}
        onclick="selectAnswer('${opt}')" style="transform:scale(1.3); margin-right:10px;">
        ${opt}
        </label>`;
    });

    html += "</div>";
    document.getElementById("quiz").innerHTML = html;

    showFeedback();
}

function selectAnswer(value) {
    if (answers[current] === null) {
        if (value === questions[current][2]) score++;
    } else {
        if (answers[current] === questions[current][2]) score--;
        if (value === questions[current][2]) score++;
    }

    answers[current] = value;
    document.getElementById("score").innerText = `Score: ${score}`;
    showFeedback();
}

function showFeedback() {
    let fb = document.getElementById("feedback");

    if (answers[current] === null) {
        fb.innerText = "";
        return;
    }

    if (answers[current] === questions[current][2]) {
        fb.innerText = "✔ Correct";
        fb.style.color = "green";
    } else {
        fb.innerText = `✘ Wrong (Correct: ${questions[current][2]})`;
        fb.style.color = "red";
    }
}

function nextQ() {
    if (current < questions.length - 1) {
        current++;
        loadQuestion();
    }
}

function prevQ() {
    if (current > 0) {
        current--;
        loadQuestion();
    }
}

function resetQuiz() {
    current = 0;
    score = 0;
    answers.fill(null);
    loadQuestion();
}

loadQuestion();

</script>

</body>
</html>
